name: Manual site

# The user manual (docs/manual) as a website on GitHub Pages, for people and agents:
# HTML with search in English and French, a sitemap, llms.txt and a Markdown copy of each page.

on:
  push:
    branches: [main]
    paths:
      - "docs/manual/**"
      - "mkdocs.yml"
      - "scripts/manual-*.py"
      - ".github/manual-requirements.txt"
      - ".github/workflows/manual-site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the manual
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MkDocs
        run: pip install -r .github/manual-requirements.txt

      - name: Manual coverage
        run: python3 scripts/manual-coverage.py

      - name: Build the site
        run: mkdocs build --strict

      - name: Pages for agents (llms.txt, Markdown copies)
        run: python3 scripts/manual-llms.py site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
